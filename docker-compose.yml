# Déploiement Dokploy (type « Docker Compose »). Variables : voir .env.example.
# Le domaine public est routé par Dokploy vers le service `app` (port 8787).
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # connexion à la base par éléments séparés : le mot de passe peut contenir n'importe quel caractère
      DB_HOST: db
      DB_USER: cabine
      DB_PASSWORD: ${POSTGRES_PASSWORD:?défini dans .env}
      DB_NAME: cabine
      APP_URL: ${APP_URL:?ex. https://maintix.mondomaine.fr}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?jeton aléatoire pour la première installation}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Maintix <no-reply@localhost>}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # alertes d'astreinte (voir docs/DEPLOY.md)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
      ESCALATION_MINUTES: ${ESCALATION_MINUTES:-10}
      # supervision
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
      APP_VERSION: ${APP_VERSION:-}
      MAIL_OUTBOX_FILE: ${MAIL_OUTBOX_FILE:-}
    # Pas de « ports » : Dokploy (Traefik) route le domaine vers le conteneur, le port 8787 n'est donc pas exposé sur Internet.
    # En local : docker compose -f docker-compose.yml -f docker-compose.local.yml up
    expose:
      - "8787"
    # Traefik (Dokploy) ne route que les conteneurs présents sur son réseau.
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/api/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cabine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?défini dans .env}
      POSTGRES_DB: cabine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabine -d cabine"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:

networks:
  # Réseau créé par Dokploy. En local, le créer une fois : docker network create dokploy-network
  dokploy-network:
    external: true

